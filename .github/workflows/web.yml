# Version navigateur de CODJIA (iPhone, Android, ordinateur) : compile le moteur Kotlin en JavaScript,
# assemble l'application web installable (PWA) et la publie sur GitHub Pages.
name: Application web CODJIA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
      - name: Compilation de l'application web
        run: |
          chmod +x gradlew
          ./gradlew -p web jsBrowserDistribution --stacktrace
      - name: Assemblage du site
        run: |
          OUT=web/build/dist/js/productionExecutable
          ls -la "$OUT"
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" "$OUT/sw.js"
          test -f "$OUT/codjia.js" && test -f "$OUT/index.html" && test -d "$OUT/assets/fonts" && test -f "$OUT/assets/music/music.json"
          test -f "$OUT/voix/codjia-voice.js"
          mkdir -p site && cp -r "$OUT"/. site/
      - name: Voix off (Piper, ONNX Runtime Web, espeak-ng) — versions et empreintes figées
        run: |
          bash tools/voice/prepare_web_voice.sh site
          test -f site/voix/fr_FR-siwis-medium.onnx && test -f site/voix/en_GB-alba-medium.onnx && test -f site/voix/ort/ort-wasm-simd-threaded.wasm
      - name: Zip de test (sans les modèles de voix, trop lourds)
        run: (cd site && zip -qr ../codjia-web.zip . -x 'voix/*.onnx')
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/upload-artifact@v5
        with:
          name: codjia-web
          path: codjia-web.zip

  # Publication : la branche gh-pages contient le site (GitHub Pages la sert à
  # https://<compte>.github.io/<dépôt>/ une fois Pages activé sur cette branche).
  publier:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: codjia-web
      - name: Mettre à jour la branche gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site && cd site && unzip -q ../codjia-web.zip && touch .nojekyll
          # Modèles de voix : récupérés à nouveau ici (le zip ne les contient pas).
          cd .. && bash tools/voice/prepare_web_voice.sh site && cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Site CODJIA depuis ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  # Second chemin : si Pages est réglé sur « Source : GitHub Actions », déploiement direct.
  # Sans effet bloquant si Pages publie la branche gh-pages.
  deployer:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Copie téléchargeable (zip) pour les tests automatiques dans un navigateur.
  zip-de-test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: codjia-web
      - name: Publier le zip de test
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete web-de-test --yes --cleanup-tag || true
          gh release create web-de-test codjia-web.zip --prerelease --target "$GITHUB_SHA" \
            --title "CODJIA web — copie de test" --notes "Copie du site construite depuis main (commit ${GITHUB_SHA::7}). Le site lui-même est sur GitHub Pages."
