# Analyse statique de sécurité (CodeQL) du code Kotlin à chaque push sur main, chaque PR et chaque semaine.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Compilation observée par CodeQL
        run: |
          chmod +x gradlew
          ./gradlew :demo-app:assembleDebug --no-build-cache --no-configuration-cache
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
