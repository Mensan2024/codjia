# Publication d'une version sur GitHub Releases : APK signé avec la clé de publication,
# empreinte SHA-256 et attestation de provenance (preuve que l'APK sort de ce dépôt et de ce workflow).
#
# Lancement : onglet Actions › « Publier une version » › Run workflow, en indiquant la version (ex. 1.0.0).
# Prérequis : les 4 secrets CODJIA_* (voir docs/PUBLIER.md) et docs/release-notes/v<version>.md.
name: Essai de signature (clé jetable)

on:
  push:
    branches: [test/release-dry]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, identique à versionName (ex. 1.0.0)"
        required: true
      prerelease:
        description: "Marquer comme pré-version"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write      # créer l'étiquette et la publication
      id-token: write      # attestation de provenance (Sigstore)
      attestations: write
    env:
      VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v5

      - name: Contrôles avant publication
        env:
          HAS_KEY: ${{ secrets.CODJIA_KEYSTORE_BASE64 != '' && secrets.CODJIA_KEYSTORE_PASSWORD != '' && secrets.CODJIA_KEY_ALIAS != '' && secrets.CODJIA_KEY_PASSWORD != '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$ ]] || { echo "::error::Version invalide : $VERSION"; exit 1; }

          grep -q "versionName = \"$VERSION\"" demo-app/build.gradle.kts || { echo "::error::versionName ne vaut pas $VERSION"; exit 1; }
          [ -f "docs/release-notes/v$VERSION.md" ] || { echo "::error::Notes de version manquantes : docs/release-notes/v$VERSION.md"; exit 1; }
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "::error::v$VERSION existe déjà"; exit 1; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Clé de publication (fichier temporaire, effacé en fin de job)
        run: |
          umask 077
          keytool -genkeypair -keystore "$RUNNER_TEMP/k.jks" -storetype PKCS12 -alias codjia -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Essai" -storepass essai-jetable-123 -keypass essai-jetable-123
          KEYSTORE_B64=$(base64 -w0 "$RUNNER_TEMP/k.jks")
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/codjia-release.jks"
          echo "CODJIA_KEYSTORE_FILE=$RUNNER_TEMP/codjia-release.jks" >> "$GITHUB_ENV"

      - name: Tests et compilation signée
        env:
          CODJIA_KEYSTORE_PASSWORD: essai-jetable-123
          CODJIA_KEY_ALIAS: codjia
          CODJIA_KEY_PASSWORD: essai-jetable-123
        run: |
          chmod +x gradlew
          ./gradlew :engine-core:test :engine-jvm:test :demo-app:assembleRelease --no-configuration-cache --stacktrace

      - name: Vérification de l'APK (signature, identifiant, permissions)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls demo-app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          [ -n "$APK" ] || { echo "::error::APK signé introuvable"; exit 1; }
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" signature.txt
          "$BT/aapt2" dump badging "$APK" | head -1 | tee badging.txt
          grep -q "package: name='io.github.mensan2024.codjia'" badging.txt
          grep -q "versionName='$VERSION'" badging.txt
          if "$BT/aapt2" dump permissions "$APK" | grep -E "INTERNET|NETWORK|EXTERNAL_STORAGE"; then echo "::error::Permission interdite"; exit 1; fi
          mkdir -p dist
          cp "$APK" "dist/CODJIA-$VERSION.apk"
          ( cd dist && sha256sum "CODJIA-$VERSION.apk" > SHA256SUMS.txt )
          CERT=$(grep -m1 "certificate SHA-256 digest" signature.txt | awk -F': ' '{print $2}')
          echo "CERT_SHA256=$CERT" >> "$GITHUB_ENV"

      - name: Résultat
        run: ls -la dist && cat dist/SHA256SUMS.txt && echo "cert=$CERT_SHA256"
      - name: Effacement de la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/codjia-release.jks"
